  <g fill="#08211A" opacity="0.9">
    <rect x="512" y="546" width="216" height="42" rx="21"/>
    <rect x="512" y="626" width="152" height="42" rx="21"/>
  </g>

  <!-- 前：问题气泡（描边用近黑色，在深色底上形成间隙） -->
